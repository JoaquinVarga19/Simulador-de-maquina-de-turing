<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador Regla 110 - MT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tape-cell { display: inline-block; width: 28px; height: 35px; border: 1px solid #ccc; text-align: center; font-weight: bold; line-height: 35px; margin: 1px; }
        .cell-one { background-color: #212529; color: #fff; }
        .cell-zero { background-color: #e9ecef; color: #000; }
    </style>
</head>
<body class="bg-light p-4">
    <div class="container bg-white p-4 rounded shadow">
        <h2>Simulador de Regla 110 (Máquina de Turing)</h2>
        <div class="row my-3">
            <div class="col-md-8">
                <input type="text" id="tapeInput" class="form-control" value="100#000000010000000#">
            </div>
            <div class="col-md-4">
                <button onclick="ejecutar()" class="btn btn-primary w-100">Simular Evolución</button>
            </div>
        </div>
        <hr>
        <h4>Evolución Generacional:</h4>
        <div id="logs" class="mt-3"></div>
    </div>

    <script>
        async function ejecutar() {
            const input = document.getElementById('tapeInput').value;
            const res = await fetch('/simulation/simulate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ inputTape: input })
            });
            const data = await res.json();
            const logsDiv = document.getElementById('logs');
            logsDiv.innerHTML = '';
            
            data.forEach(step => {
                let html = `<div class="mb-2"><strong>Paso ${step.step}</strong> <small class="text-muted">(${step.state})</small><br><code>`;
                for(let i=0; i < step.contentTape.length; i++) {
                    let char = step.contentTape[i];
                    let cssClass = char === '1' ? 'cell-one' : (char === '0' ? 'cell-zero' : '');
                    html += `<span class="tape-cell ${cssClass}">${char}</span>`;
                }
                html += `</code></div>`;
                logsDiv.innerHTML += html;
            });
        }
    </script>
</body>
</html>
